name: Refresh NPPA game approval dataset (2026-10)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-nppa.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nppa-2026-10-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout data repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install required parsers
        run: python -m pip install -r scripts/requirements.txt
      - name: Refresh data using official NPPA sources and verify counts
        run: python scripts/update_nppa_recent.py --apply
      - name: Verify output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('public/nppa-games.json').read_text(encoding='utf-8'))
          records=obj['records']
          metadata=obj['metadata']
          assert len(records)==30144, f"unexpected row count: {len(records)}"
          assert metadata['officialSearchTotal']==30144
          assert metadata['updatedThrough']=='2026-10-28'
          print('Verified 30,144 official records, latest 2026-10-28')
          PY
      - name: Commit refreshed website records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/nppa-games.json data/nppa-games.csv nppa-sync-report.json
          if ! git diff --cached --quiet; then
            git commit -m "data: synchronize NPPA approvals through October 2026 (30,144 records)"
            git push origin HEAD:main
          fi
